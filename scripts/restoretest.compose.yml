# Wegwerf-Instanz für scripts/test-restore.sh – wird nach dem Test komplett entfernt.
# Kein Port nach außen, Daten nur im Arbeitsspeicher (tmpfs) bzw. in Wegwerf-Volumes.
name: paperless-restoretest

services:
  broker:
    image: docker.io/valkey/valkey:9.1.2-alpine
  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: restoretest
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      retries: 10
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: restoretest
      PAPERLESS_SECRET_KEY: restoretest-wegwerf
      USERMAP_UID: ${APP_UID:-1001}
      USERMAP_GID: ${APP_GID:-1001}
    volumes:
      # Der zu prüfende Export (nur lesend)
      - ../backups/export:/usr/src/paperless/export:ro
    tmpfs:
      - /usr/src/paperless/data
      - /usr/src/paperless/media
      - /usr/src/paperless/consume
